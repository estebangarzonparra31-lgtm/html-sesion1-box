<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Perfil Personal</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #e0e0e0 url('https://www.transparenttextures.com/patterns/concrete-wall.png');
      background-size: cover;
    }
    .banner {
      background: linear-gradient(90deg, teal 70%, gold 30%);
      color: white;
      padding: 20px;
      display: flex;
      justify-content: flex-start;
      align-items: center;
    }
    .banner h1 {
      margin: 0;
      font-size: 2em;
    }
    .intro {
      text-align: center;
      padding: 40px 20px;
    }
    .intro h2 {
      margin: 0;
      font-size: 1.8em;
      color: #333;
    }
    .profile-img {
      display: flex;
      justify-content: center;
      margin-top: 20px;
    }
    .profile-img img {
      border-radius: 8px;
      max-width: 250px;
    }
  </style>
</head>
<body>
  <div class="banner">
    <h1>EL CANTANTE DEL GHETO</h1>
  </div>

  <div class="intro">
    <h2>AWOOOO,Ryan Castro </h2>
    <div class="profile-img">
      <!-- Aquí colocas tu foto -->
      <img src="mi-foto.png" alt="Foto de perfil">
    </div>
  </div>
</body>
</html>
